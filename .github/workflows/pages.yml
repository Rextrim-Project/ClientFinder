name: Deploy GitHub Pages

# Aplikasi production butuh Node runtime (API routes, sesi, database), jadi
# tidak bisa di-export statis. Pages hanya menyajikan halaman pengarah ke
# deployment production.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build halaman Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Siapkan artifact
        run: |
          mkdir -p site
          cat > site/index.html <<'HTML'
          <!doctype html>
          <html lang="id">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Client Finder</title>
            <meta http-equiv="refresh" content="0; url=https://client-finder.frel.cloud/">
            <link rel="canonical" href="https://client-finder.frel.cloud/">
          </head>
          <body>
            <p>Mengalihkan ke <a href="https://client-finder.frel.cloud/">client-finder.frel.cloud</a>…</p>
          </body>
          </html>
          HTML
          touch site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
